<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Editor de Links (uso local)</title>
  <style>
    :root {
      --bg: #f7f7f8;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --text-muted: #6b6b70;
      --border: #e4e4e7;
      --accent: #2d6cdf;
      --accent-text: #ffffff;
      --danger: #d9534f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 32px 16px 80px;
    }
    .wrap { max-width: 640px; margin: 0 auto; }
    h1 { font-size: 20px; margin-bottom: 4px; }
    .warn {
      background: #fff6e5;
      border: 1px solid #f0d58c;
      color: #7a5b00;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 20px;
    }
    .card h2 { font-size: 15px; margin: 0 0 14px; }
    label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin: 10px 0 4px;
    }
    input[type="text"], input[type="url"] {
      width: 100%;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      background: var(--bg);
      color: var(--text);
    }
    .row { display: flex; gap: 10px; }
    .row > div { flex: 1; }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-primary { background: var(--accent); color: var(--accent-text); }
    .btn-danger { background: #fdecea; color: var(--danger); }
    .btn-secondary { background: var(--border); color: var(--text); }
    .link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .link-item:last-child { border-bottom: none; }
    .link-item .meta { flex: 1; min-width: 0; }
    .link-item .title { font-weight: 600; font-size: 14px; }
    .link-item .url { font-size: 12px; color: var(--text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .link-item .cat { font-size: 11px; color: var(--text-muted); }
    .actions-col { display: flex; gap: 6px; }
    .top-actions {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    #file-input { display: none; }
    .ok-msg {
      background: #e8f7ea;
      border: 1px solid #a9dbb1;
      color: #1d6b2c;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Editor de Links</h1>
    <div class="warn">
      Esta página é só para uso local (abra ela no seu computador, não publique
      este arquivo). Nada daqui é enviado para a internet: você edita, baixa o
      arquivo atualizado e sobe no GitHub manualmente.
    </div>

    <div class="ok-msg" id="ok-msg"></div>

    <div class="top-actions">
      <button class="btn-secondary" onclick="document.getElementById('file-input').click()">Carregar data.json atual</button>
      <input type="file" id="file-input" accept="application/json" />
      <button class="btn-primary" onclick="downloadData()">Baixar data.json atualizado</button>
    </div>

    <div class="card">
      <h2>Perfil</h2>
      <label>Nome</label>
      <input type="text" id="p-name" />
      <label>Bio / descrição curta</label>
      <input type="text" id="p-bio" />
      <label>URL da foto (opcional)</label>
      <input type="url" id="p-avatar" placeholder="https://..." />
    </div>

    <div class="card">
      <h2>Adicionar novo link</h2>
      <label>Título</label>
      <input type="text" id="n-title" placeholder="Nome do produto ou loja" />
      <div class="row">
        <div>
          <label>URL do link de afiliado</label>
          <input type="url" id="n-url" placeholder="https://..." />
        </div>
        <div>
          <label>Categoria</label>
          <input type="text" id="n-category" placeholder="Ex: Beleza, Casa, Moda" />
        </div>
      </div>
      <label>Ícone (um emoji, opcional)</label>
      <input type="text" id="n-icon" placeholder="🔗" />
      <div style="margin-top: 14px;">
        <button class="btn-primary" onclick="addLink()">Adicionar link</button>
      </div>
    </div>

    <div class="card">
      <h2>Links cadastrados</h2>
      <div id="links-list"></div>
    </div>
  </div>

  <script>
    let data = { profile: { name: "", bio: "", avatar: "" }, links: [] };

    function renderProfileForm() {
      document.getElementById("p-name").value = data.profile.name || "";
      document.getElementById("p-bio").value = data.profile.bio || "";
      document.getElementById("p-avatar").value = data.profile.avatar || "";
    }

    function syncProfileFromForm() {
      data.profile.name = document.getElementById("p-name").value.trim();
      data.profile.bio = document.getElementById("p-bio").value.trim();
      data.profile.avatar = document.getElementById("p-avatar").value.trim();
    }

    ["p-name", "p-bio", "p-avatar"].forEach((id) => {
      document.getElementById(id).addEventListener("input", syncProfileFromForm);
    });

    function renderLinksList() {
      const list = document.getElementById("links-list");
      list.innerHTML = "";
      if (!data.links.length) {
        list.innerHTML = '<p style="color:var(--text-muted);font-size:13px;">Nenhum link ainda.</p>';
        return;
      }
      data.links.forEach((link, index) => {
        const row = document.createElement("div");
        row.className = "link-item";
        row.innerHTML = `
          <div class="meta">
            <div class="title">${link.icon || "🔗"} ${escapeHtml(link.title)}</div>
            <div class="url">${escapeHtml(link.url)}</div>
            <div class="cat">${escapeHtml(link.category || "Geral")}</div>
          </div>
          <div class="actions-col">
            <button class="btn-secondary" data-action="up" data-index="${index}">↑</button>
            <button class="btn-secondary" data-action="down" data-index="${index}">↓</button>
            <button class="btn-danger" data-action="remove" data-index="${index}">Remover</button>
          </div>
        `;
        list.appendChild(row);
      });
    }

    document.getElementById("links-list").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-action]");
      if (!btn) return;
      const index = parseInt(btn.dataset.index, 10);
      const action = btn.dataset.action;
      if (action === "remove") {
        if (confirm("Remover este link?")) {
          data.links.splice(index, 1);
        }
      } else if (action === "up" && index > 0) {
        [data.links[index - 1], data.links[index]] = [data.links[index], data.links[index - 1]];
      } else if (action === "down" && index < data.links.length - 1) {
        [data.links[index + 1], data.links[index]] = [data.links[index], data.links[index + 1]];
      }
      renderLinksList();
    });

    function addLink() {
      const title = document.getElementById("n-title").value.trim();
      const url = document.getElementById("n-url").value.trim();
      const category = document.getElementById("n-category").value.trim() || "Geral";
      const icon = document.getElementById("n-icon").value.trim() || "🔗";

      if (!title || !url) {
        alert("Preencha pelo menos o título e a URL.");
        return;
      }
      try {
        new URL(url);
      } catch {
        alert("Essa URL não parece válida. Confira se começa com https://");
        return;
      }

      data.links.push({
        id: "link-" + Date.now(),
        title,
        url,
        category,
        icon,
      });

      document.getElementById("n-title").value = "";
      document.getElementById("n-url").value = "";
      document.getElementById("n-category").value = "";
      document.getElementById("n-icon").value = "";

      renderLinksList();
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str || "";
      return div.innerHTML;
    }

    document.getElementById("file-input").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(reader.result);
          data = {
            profile: parsed.profile || { name: "", bio: "", avatar: "" },
            links: parsed.links || [],
          };
          renderProfileForm();
          renderLinksList();
          showOk("Arquivo carregado com sucesso.");
        } catch {
          alert("Não foi possível ler esse arquivo. Confira se é o data.json correto.");
        }
      };
      reader.readAsText(file);
    });

    function downloadData() {
      syncProfileFromForm();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "data.json";
      a.click();
      URL.revokeObjectURL(url);
      showOk("Baixado! Agora suba esse arquivo no GitHub substituindo o data.json do repositório.");
    }

    function showOk(msg) {
      const el = document.getElementById("ok-msg");
      el.textContent = msg;
      el.style.display = "block";
      setTimeout(() => (el.style.display = "none"), 4000);
    }

    renderProfileForm();
    renderLinksList();
  </script>
</body>
</html>
