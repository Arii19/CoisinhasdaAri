<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Links</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="profile" id="profile">
      <div class="avatar" id="avatar"></div>
      <h1 class="name" id="name">Carregando...</h1>
      <p class="bio" id="bio"></p>
    </div>

    <div id="links-container"></div>

    <p class="disclosure">
      Este site pode conter links de afiliado. Isso significa que, ao comprar
      por meio deles, eu posso receber uma pequena comissão, sem nenhum
      custo adicional para você.
    </p>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch("data.json", { cache: "no-store" });
        const data = await res.json();
        renderProfile(data.profile || {});
        renderLinks(data.links || []);
      } catch (err) {
        document.getElementById("name").textContent = "Erro ao carregar links";
        console.error(err);
      }
    }

    function renderProfile(profile) {
      document.getElementById("name").textContent = profile.name || "Meus Links";
      document.getElementById("bio").textContent = profile.bio || "";
      const avatar = document.getElementById("avatar");
      if (profile.avatar) {
        avatar.style.backgroundImage = `url(${profile.avatar})`;
        avatar.style.backgroundSize = "cover";
        avatar.style.backgroundPosition = "center";
      }
    }

    function renderLinks(links) {
      const container = document.getElementById("links-container");
      container.innerHTML = "";

      if (!links.length) {
        container.innerHTML = '<p class="empty">Nenhum link cadastrado ainda.</p>';
        return;
      }

      const list = document.createElement("div");
      list.className = "links";

      links.forEach((link) => {
        const a = document.createElement("a");
        a.className = "link-btn";
        a.href = link.url;
        a.target = "_blank";
        a.rel = "sponsored noopener noreferrer";

        if (link.image) {
          const thumb = document.createElement("img");
          thumb.className = "link-thumb";
          thumb.src = link.image;
          thumb.alt = "";
          a.appendChild(thumb);
        } else {
          const icon = document.createElement("span");
          icon.className = "link-icon";
          icon.textContent = link.icon || "🔗";
          a.appendChild(icon);
        }

        const title = document.createElement("span");
        title.textContent = link.title;
        a.appendChild(title);

        list.appendChild(a);
      });

      container.appendChild(list);
    }

    loadData();
  </script>
</body>
</html>
