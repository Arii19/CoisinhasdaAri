<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus Links</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="page">
    <div class="profile" id="profile">
      <img class="avatar" id="avatar" alt="" />
      <h1 class="name" id="name">Carregando...</h1>
      <p class="bio" id="bio"></p>
    </div>

    <div id="links-container"></div>

    <p class="disclosure">
      Este site pode conter links de afiliado. Isso significa que, ao comprar
      por meio deles, eu posso receber uma pequena comissão, sem nenhum
      custo adicional para você.
    </p>
  </div>

  <script>
    async function loadData() {
      try {
        const res = await fetch("data.json", { cache: "no-store" });
        const data = await res.json();
        renderProfile(data.profile || {});
        renderLinks(data.links || []);
      } catch (err) {
        document.getElementById("name").textContent = "Erro ao carregar links";
        console.error(err);
      }
    }

    function isSafeMediaUrl(url) {
      if (!url) return false;
      if (url.startsWith("http://") || url.startsWith("https://")) return true;
      if (url.startsWith("images/")) return true;
      return false;
    }

    function renderProfile(profile) {
      const name = profile.name || "Meus Links";
      document.getElementById("name").textContent = name;
      document.getElementById("bio").textContent = profile.bio || "";
      const avatar = document.getElementById("avatar");
      avatar.alt = name;
      if (isSafeMediaUrl(profile.avatar)) {
        avatar.src = profile.avatar;
      }
    }

    function renderLinks(links) {
      const container = document.getElementById("links-container");
      container.innerHTML = "";

      if (!links.length) {
        container.innerHTML = '<p class="empty">Nenhum link cadastrado ainda.</p>';
        return;
      }

      const byCategory = {};
      links.forEach((link) => {
        const cat = link.category || "Geral";
        if (!byCategory[cat]) byCategory[cat] = [];
        byCategory[cat].push(link);
      });

      const categories = Object.keys(byCategory);
      const singleCategory = categories.length === 1;

      categories.forEach((cat) => {
        const section = document.createElement("div");
        section.className = "category-section";

        const list = document.createElement("div");
        list.className = "links";

        byCategory[cat].forEach((link) => {
          if (!link.url || !(link.url.startsWith("http://") || link.url.startsWith("https://"))) {
            return;
          }

          const a = document.createElement("a");
          a.className = "link-btn";
          a.href = link.url;
          a.target = "_blank";
          a.rel = "sponsored noopener noreferrer";

          if (isSafeMediaUrl(link.image)) {
            const thumb = document.createElement("img");
            thumb.className = "link-thumb";
            thumb.src = link.image;
            thumb.alt = "";
            a.appendChild(thumb);
          } else {
            const icon = document.createElement("span");
            icon.className = "link-icon";
            icon.textContent = link.icon || "🔗";
            a.appendChild(icon);
          }

          const title = document.createElement("span");
          title.textContent = link.title;
          a.appendChild(title);

          list.appendChild(a);
        });

        if (singleCategory) {
          section.appendChild(list);
        } else {
          const header = document.createElement("button");
          header.type = "button";
          header.className = "category-header";
          header.setAttribute("aria-expanded", "false");

          const name = document.createElement("span");
          name.textContent = cat;
          const chevron = document.createElement("span");
          chevron.className = "chevron";
          chevron.textContent = "›";

          header.appendChild(name);
          header.appendChild(chevron);

          list.classList.add("collapsed");

          header.addEventListener("click", () => {
            const isOpen = list.classList.toggle("open");
            list.classList.toggle("collapsed", !isOpen);
            header.setAttribute("aria-expanded", String(isOpen));
            header.classList.toggle("open", isOpen);
          });

          section.appendChild(header);
          section.appendChild(list);
        }

        container.appendChild(section);
      });
    }

    loadData();
  </script>
</body>
</html>
